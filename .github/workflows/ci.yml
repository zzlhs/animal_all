name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: gbif_test
          POSTGRES_USER: gbif
          POSTGRES_PASSWORD: gbif
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gbif -d gbif_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://gbif:gbif@127.0.0.1:5432/gbif_test
      TEST_DATABASE_URL: postgres://gbif:gbif@127.0.0.1:5432/gbif_test
      ACTIVE_DATASET_VERSION: sample-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck:web
      - run: npm run typecheck --workspace apps/worker
      - run: npm test
      - run: npm run build
      - name: Import sample and export real PostgreSQL map records
        run: |
          npm run db:migrate
          npm run db:seed -- --version sample-ci
          npm run map:export -- --version sample-ci --output "$PWD/artifacts/ci-map.geojsonseq"
          test "$(wc -l < artifacts/ci-map.geojsonseq)" -gt 115
      - name: Verify persistent production listener and SSR
        run: |
          npm run start > /tmp/gbif-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          npm run smoke:web
