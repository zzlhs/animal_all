services:
  database:
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_DB: gbif_globe
      POSTGRES_USER: gbif
      POSTGRES_PASSWORD: gbif
    ports:
      - "5432:5432"
    volumes:
      - gbif-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbif -d gbif_globe"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://gbif:gbif@database:5432/gbif_globe
    ports:
      - "3100:3100"
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/server.js"]

volumes:
  gbif-postgres-data:
